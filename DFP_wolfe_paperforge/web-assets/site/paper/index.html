<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rendered paper preview for the DFP Wolfe counterexample formalization.">
  <title>Paper - DFP Wolfe Counterexample</title>
  <style>
    :root { color-scheme: light; --ink: #17221d; --muted: #53635b; --line: #d8e0da; --accent: #1b6a4a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; color: var(--ink); background: #f7faf8;
      font: 14px/1.4 system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      min-height: 3.25rem; padding: .55rem 1rem; border-bottom: 1px solid var(--line); background: #fff; }
    .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    nav { display: flex; flex-wrap: wrap; gap: .7rem; }
    a { color: var(--accent); }
    nav a { text-decoration: none; font-weight: 650; }
    nav a:hover, nav a:focus-visible { text-decoration: underline; }
    main { flex: 1; min-height: 0; padding: .75rem; }
    iframe { display: block; width: 100%; height: 100%; min-height: 32rem; border: 1px solid var(--line);
      background: #fff; }
    .fallback { max-width: 48rem; margin: 3rem auto; padding: 1.5rem; background: #fff; border: 1px solid var(--line); }
    .fallback h1 { margin-top: 0; font: 700 1.5rem/1.2 Georgia, serif; }
    @media (max-width: 42rem) {
      header { align-items: flex-start; flex-direction: column; }
      .title { max-width: 100%; white-space: normal; }
      main { padding: 0; }
      iframe { border-left: 0; border-right: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">DFP Wolfe Counterexample - rendered paper</div>
    <nav aria-label="Paper navigation">
      <a href="../">Project home</a>
      <a href="https://arxiv.org/html/2608.21708v1" target="_blank" rel="noopener">Open on arXiv</a>
    </nav>
  </header>
  <main>
    <iframe src="https://arxiv.org/html/2608.21708v1"
      title="A counterexample to global convergence of classical DFP under the standard strong Wolfe conditions"
      loading="eager"></iframe>
    <noscript>
      <div class="fallback">
        <h1>Rendered paper</h1>
        <p>JavaScript is disabled. Open the <a href="https://arxiv.org/html/2608.21708v1">arXiv HTML edition</a>.</p>
      </div>
    </noscript>
  </main>
</body>
</html>
