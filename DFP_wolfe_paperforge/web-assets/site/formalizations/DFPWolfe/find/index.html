<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lean declaration lookup · DFP Wolfe Counterexample</title>
  <style>
    :root { color-scheme: light; --ink: #17221d; --muted: #53635b;
      --line: #d8e0da; --field: #f3f7f4; --accent: #1b6a4a; --error: #9b2c2c; }
    * { box-sizing: border-box; }
    body { max-width: 56rem; margin: 0 auto; padding: 3rem 1.5rem 4rem;
      color: var(--ink); background: #fff; font: 16px/1.6 system-ui, sans-serif; }
    h1, h2 { font-family: Georgia, serif; }
    h1 { border-bottom: 1px solid var(--line); padding-bottom: 1rem; }
    code { display: inline-block; padding: .15rem .3rem; background: var(--field);
      font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
    a { color: var(--accent); }
    .back { display: inline-block; margin-bottom: 1rem; }
    .meta { color: var(--muted); }
    .error { color: var(--error); }
  </style>
</head>
<body>
  <a class="back" href="../">Back to the declaration index</a>
  <h1>Lean declaration lookup</h1>
  <p id="status" class="meta">Loading the pinned declaration map...</p>
  <div id="result"></div>
  <script>
    (() => {
      const query = new URLSearchParams(window.location.search).get("pattern") || "";
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      const add = (tag, text, parent = result) => {
        const node = document.createElement(tag);
        node.textContent = text;
        parent.appendChild(node);
        return node;
      };
      fetch("../declarations.json", { credentials: "omit" })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((payload) => {
          const rec = payload.declarations && payload.declarations[query];
          if (!query) {
            status.textContent = "No declaration was requested.";
            add("p", "Open a badge link with a pattern query to resolve it.");
            return;
          }
          if (!rec) {
            status.textContent = "The requested declaration is not in the reviewed map.";
            status.className = "error";
            add("p", query);
            const link = document.createElement("a");
            link.href = payload.repository;
            link.textContent = "Open the Lean repository";
            result.appendChild(link);
            return;
          }
          status.textContent = `Pinned snapshot: ${payload.snapshot}`;
          add("h2", query);
          add("p", rec.cited ? `Paper interface: ${rec.cited}` : "Paper interface");
          const source = document.createElement("p");
          source.appendChild(document.createTextNode(`${rec.file}:L${rec.line} `));
          const link = document.createElement("a");
          link.href = `${payload.repository}/blob/${payload.snapshot}/${rec.file}?plain=1#L${rec.line}`;
          link.textContent = "Open pinned Lean source";
          link.rel = "noopener";
          source.appendChild(link);
          result.appendChild(source);
        })
        .catch((error) => {
          status.textContent = `Declaration map could not be loaded (${error.message}).`;
          status.className = "error";
        });
    })();
  </script>
</body>
</html>
