# paperforge instance config — the annotated catalogue of every knob
# lives in <paperforge>/templates/paper.toml; docs/CONFIGURATION.md
# documents the semantics. Machine-local values (the PreTeXt core
# XSL path) belong in .paperforge.local.toml, not here.

[paperforge]
instance_schema = 1

[paper]
title = "A counterexample to global convergence of classical DFP under the standard strong Wolfe conditions"
slug = "dfp-wolfe"
document_id = "dfp-wolfe"

[inputs]
ai_draft = "inputs/draft/main.tex"

[formalizations.primary]
name = "DFPWolfe"
root = ".."
module = "DFPWolfe"            # paper-facing Lean modules
docs_root = "../formalizations/" # deployed source-level declaration index
declmap = "crosswalk/lean-decl-map.json"

[ingest]
mathbb_letters = ""
# Temporary bootstrap profile: PaperForge needs a new profile for this draft's
# global theorem counter before a release build can be trusted.
numbering_profile = "amsart-shared-section-theorems-global-equations"
authors = [
  "@draft",
  "Zichen Wang|School of Mathematical Sciences|Peking University|Beijing 100871, China",
  "Zaiwen Wen|Beijing International Center for Mathematical Research|Peking University|Beijing 100871, China",
  "Liwei Zhang|National Frontiers Science Center for Industrial Intelligence and Systems Optimization|Northeastern University|Shenyang 110819, China|Key Laboratory of Data Analytics and Optimization for Smart Industry (Northeastern University), Ministry of Education",
  "Yaxiang Yuan|Academy of Mathematics and Systems Science|Chinese Academy of Sciences|Beijing 100190, China"
]
# [[ingest.literal_rewrites]]     # structural draft macros
# from = "\\MyMacro"
# to = "\\cref{prop:target}"

[style]
corpus = "style-corpus/"
advice = "style-corpus/ADVICE.md"

[references]
pdf_dir = "references/"
bib = "source/references.ptx"
labels = "references/bib-labels.json"

[notation]
far_words = 1500
near_hover_delay_ms = 200
far_hover_delay_ms = 500
defsite_highlight_delay_ms = 120

[detail]
default_level = 1
max_level = 3

# The converter already emits opening prose for these divisions, but the
# current simulator does not wrap single-block sections in <introduction>.
# Keep the deliberate waivers explicit so the validator remains auditable.
[validators.section_summaries]
exempt = [
  "sec-introduction",
  "sec-statement",
  "sec-numerics",
  "sec-conclusion",
  "app-algebra",
  "sec-acknowledgments",
]

[plagiarism]
ngram = 7
error_run = 12
sources = ["references/"]

[build]
web_output = "output/web"
print_output = "output/print"

[site]
dir = "web-assets/site"
