  status: "sentence-links-reviewed-with-explicit-boundaries"
  divergences: >
    The formalization carries historical paper-number citations in many module
    docstrings, while the latest manuscript uses a global theorem counter. The
    publication TeX now links every theorem-like statement to the reviewed
    Lean interface, and the sentence manifest records theorem/proof prose and
    captions with explicit boundary categories. Numerical experiments remain
    computational evidence and are not Lean theorem statements. A matched
    PaperForge numbering snapshot is still required before a public badge
    release.

